<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100d1a"/>
      <stop offset=".58" stop-color="#21162d"/>
      <stop offset="1" stop-color="#39213d"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#35213e"/><stop offset="1" stop-color="#191321"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#17121f"/><stop offset=".5" stop-color="#302039"/><stop offset="1" stop-color="#130f1b"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#382344"/><stop offset=".35" stop-color="#21152d"/><stop offset="1" stop-color="#100c19"/>
    </linearGradient>
    <linearGradient id="moss" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5a43"/><stop offset=".45" stop-color="#c18b55"/><stop offset="1" stop-color="#5d405f"/>
    </linearGradient>
    <radialGradient id="moonlight">
      <stop stop-color="#f3b66b" stop-opacity=".2"/><stop offset=".42" stop-color="#b77886" stop-opacity=".09"/><stop offset="1" stop-color="#9b668d" stop-opacity="0"/>
